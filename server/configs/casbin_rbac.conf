# Casbin RBAC-with-domains 模型(已支持 allow/deny 优先级)
# 文档 §5.2 / §6 / 后台权限模型设计V1.0.md §6
#
# 升级点(Phase 1.1):
#   1. policy_definition 加 eft 字段 — 支持 allow / deny 显式声明
#   2. policy_effect 改为 allow && !deny — 显式 deny 永远赢
#   3. matcher 放宽 p.dom 匹配 — p.dom="global" 时跨任意 r.dom 生效
#      (现状 rbac.go 总是传 r.dom="global",所以本次升级对存量策略无影响;
#       同时为后续 permission_grant 跨项目授权预留 p.dom=specific domain 通道)
#
# ⚠️ 2026-11-01(M147):obj 的匹配从 keyMatch2 改成 **keyMatch**
#
#   原因:**r.obj 装的是资源码,不是 URL 路径**。
#   keyMatch2 是给路径写的 —— 它把 ":xxx" 当成路径参数,
#   于是 "user:list" 被编译成正则 ^user[^/]+$ :
#     · 绑了 user:list 的角色**也能过 user:delete 的检查**(模块内权限互相串味);
#     · "house:*" 这种 deny 规则**永不生效**(keyMatch2("house","house:*") = false)。
#   资源码命名空间里 ":" 是**字面量分隔符**("user" + ":" + "list"),
#   要的是"精确匹配 + * 后缀通配" —— 正好是 keyMatch 的语义。
#   (仓里 authz.MatchPermissionCode 是同一套语义,见 permissions.go)
#
#   配套的两处改动(**缺一不可**):
#     · internal/seed/seed.go buildRolePolicies —— 删掉"每角色一条通配行";
#     · internal/api/middleware/rbac.go decideAccess —— 请求 obj 传**完整资源码**。

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act, eft

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
m = g(r.sub, p.sub, r.dom) && (r.dom == p.dom || p.dom == "global") && keyMatch(r.obj, p.obj) && (r.act == p.act || p.act == "*")
